buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:9.1.0"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        //mavenLocal()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Tarea para verificar que las variables de entorno necesarias estén configuradas
task verifyBuildEnvironment {
    doLast {
        def androidHome = System.getenv("ANDROID_HOME")
        def javaHome = System.getenv("JAVA_HOME")

        if (androidHome == null) {
            throw new GradleException("La variable de entorno ANDROID_HOME no está configurada")
        }
        if (javaHome == null) {
            throw new GradleException("La variable de entorno JAVA_HOME no está configurada")
        }
        // Verificamos que el directorio bin de Java exista
        def javaBin = new File(javaHome, "bin")
        if (!javaBin.exists()) {
            throw new GradleException("El directorio JAVA_HOME/bin no existe en $javaBin")
        }

        println "ANDROID_HOME: $androidHome"
        println "JAVA_HOME: $javaHome"
    }
}

// Make preBuild depend on verification
subprojects {
    afterEvaluate { project ->
        if (project.tasks.findByName('preBuild')) {
            project.tasks.preBuild.dependsOn rootProject.verifyBuildEnvironment
        }
    }
}
